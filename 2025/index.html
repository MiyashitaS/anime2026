<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>2025 アニソンランキング</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#f6f7f9;--card:#fff;--line:#e2e5ea;--ink:#202124;--sub:#5f6368;--acc:#c2185b}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1f2226;--line:#33373d;--ink:#e8eaed;--sub:#9aa0a6;--acc:#f06292}}
body{margin:0;font:14px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0 8px 0 0}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
a.back{margin-left:auto;color:var(--acc);font-weight:700;text-decoration:none}
main{max-width:980px;margin:0 auto;padding:16px}
h2{font-size:16px;margin:24px 0 8px}h3{font-size:14px;margin:16px 0 6px;color:var(--sub)}
.lead{color:var(--sub);margin:4px 0 12px}
ol.rk{list-style:none;padding:0;margin:0;display:grid;gap:6px}
ol.rk li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.rkn{font-weight:800;color:var(--acc);min-width:2em;text-align:right}.rkt{flex:1;min-width:0}.rkc{color:var(--sub);font-size:12px;white-space:nowrap}
.yt{display:inline-block;background:#f00;color:#fff;border-radius:5px;font-size:10px;line-height:1;padding:3px 6px;text-decoration:none;vertical-align:1px;margin-left:6px}
.tbw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--sub);font-weight:600;font-size:12px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.song{cursor:pointer}tr.song:hover{background:color-mix(in srgb,var(--acc) 6%,transparent)}
tr.det td{white-space:normal;color:var(--sub);font-size:12px;background:var(--bg)}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;text-align:center;max-width:340px;width:100%}
#gate input{width:100%;font:inherit;padding:8px;margin:8px 0;text-align:center;letter-spacing:.2em}
#gate button{font:inherit;padding:6px 20px;border-radius:999px;border:0;background:var(--acc);color:#fff}
</style></head><body>
<header><h1>2025 アニソンランキング</h1><span id="tabs"></span><a class="back" href="../">2026 へ ▶</a></header>
<main id="main"><p class="lead">読み込み中…</p></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f2=x=>x==null?"-":(Math.round(x*100)/100).toFixed(2);
const PWK="anime2026_pw";
async function dkey(pw,salt){const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:200000},b,256))}
async function dec(buf,pw){const u=new Uint8Array(buf),salt=u.slice(0,16),mac=u.slice(16,48),ct=u.slice(48);const k=await dkey(pw,salt);
 const hk=await crypto.subtle.importKey("raw",k,{name:"HMAC",hash:"SHA-256"},false,["sign"]);const m=new Uint8Array(await crypto.subtle.sign("HMAC",hk,ct));
 if(m.length!==mac.length||m.some((x,i)=>x!==mac[i]))throw new Error("pw");
 const n=Math.ceil(ct.length/32);const B=(await Promise.all(Array.from({length:n},(_,i)=>{const a=new Uint8Array(36);a.set(k);new DataView(a.buffer).setUint32(32,i);return crypto.subtle.digest("SHA-256",a)}))).map(x=>new Uint8Array(x));
 const out=new Uint8Array(ct.length);for(let i=0;i<ct.length;i++)out[i]=ct[i]^B[i>>5][i&31];return JSON.parse(new TextDecoder().decode(out))}
let D=null,TAB="all";
const SE=["冬","春","夏","秋"];
const yt=s=>"https://www.youtube.com/results?search_query="+encodeURIComponent(s+" アニメ");
const T=x=>`<span class="rkt">${esc(x.s)}<a class="yt" href="${yt(x.s)}" target="_blank" rel="noopener" title="YouTube">▶</a></span>`;
const row=(k,x)=>`<li><span class="rkn">${k}</span>${T(x)}<span class="rkc">${x.se}・平均 ${f2(x.av)}・${x.n}人</span></li>`;
function tabs(){$("tabs").innerHTML=[["all","総合"],...SE.map(s=>[s,s]),["people","採点者"]].map(([k,l])=>`<button class="tab${TAB===k?" on":""}" data-t="${k}">${l}</button>`).join(" ")}
function table(L){return '<div class="tbw"><table><tr><th>#</th><th>曲</th><th class="n">平均</th><th class="n">補正</th><th class="n">人数</th><th class="n">ばらつき</th><th>推薦</th></tr>'+
  L.map((x,i)=>`<tr class="song" data-i="${D.songs.indexOf(x)}"><td class="n">${x.b||"-"}</td><td>${T(x)}</td><td class="n">${f2(x.av)}</td><td class="n">${f2(x.z)}</td><td class="n">${x.n}</td><td class="n">${f2(x.sd)}</td><td>${esc(x.rec)}</td></tr>`).join("")+'</table></div>'}
function render(){tabs();const S=D.songs.filter(x=>x.av!=null);let h="";
  if(TAB==="all"){
    h='<p class="lead">'+D.year+'年に採点したアニソンの結果です（'+D.songs.length+'曲・採点者 '+D.names.length+'人）。推薦はすべて匿名扱いです。「補正」は人ごとの甘辛を揃えた値（0が平均）。</p>';
    h+='<h2>全体 TOP10</h2><ol class="rk">'+S.filter(x=>x.a<=10).sort((a,b)=>a.a-b.a).map(x=>row(x.a,x)).join("")+'</ol>';
    SE.forEach(s=>{const g=S.filter(x=>x.se===s&&x.b<=3).sort((a,b)=>a.b-b.b);if(g.length)h+=`<h2>${s} TOP3</h2><ol class="rk">`+g.map(x=>row(x.b,x)).join("")+'</ol>'});
  }else if(TAB==="people"){
    h='<h2>採点者</h2><div class="tbw"><table><tr><th>名前</th><th class="n">採点した曲</th><th class="n">平均点</th><th>一番の推し</th></tr>'+D.people.map(p=>{const t=D.songs.filter(x=>p.name in x.sc).sort((a,b)=>b.sc[p.name]-a.sc[p.name])[0];return`<tr><td>${esc(p.name)}</td><td class="n">${p.n}</td><td class="n">${f2(p.mean)}</td><td>${t?esc(t.s)+"（"+t.sc[p.name]+"）":"-"}</td></tr>`}).join("")+'</table></div>';
  }else{
    const g=D.songs.filter(x=>x.se===TAB).sort((a,b)=>(a.b||1e9)-(b.b||1e9));
    h=`<h2>${TAB}アニメ（${g.length}曲）</h2><p class="lead">行を押すと各人の点が出ます。</p>`+table(g);
  }
  $("main").innerHTML=h;window.scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest(".tab");if(t){TAB=t.dataset.t;render();return}
  const r=e.target.closest("tr.song");if(!r||e.target.closest("a"))return;const n=r.nextElementSibling;if(n&&n.classList.contains("det")){n.remove();return}
  const x=D.songs[+r.dataset.i];r.insertAdjacentHTML("afterend",`<tr class="det"><td></td><td colspan="6">${D.names.map(k=>esc(k)+" "+(k in x.sc?x.sc[k]:"－")).join("　")}</td></tr>`)});
function unlock(pw){return fetch("data.bin",{cache:"no-store"}).then(r=>r.arrayBuffer()).then(b=>dec(b,pw)).then(d=>{try{localStorage.setItem(PWK,pw)}catch(e){}const g=$("gate");if(g)g.remove();D=d;render()})}
function gate(){const g=document.createElement("div");g.id="gate";g.innerHTML='<form id="gf"><h1>2025 アニソンランキング</h1><p>パスワード（8桁）を入力してください</p><input id="gp" type="password" inputmode="numeric" autocomplete="current-password"><button>開く</button><p id="gm"></p></form>';document.body.appendChild(g);
  $("gf").onsubmit=e=>{e.preventDefault();$("gm").textContent="確認中…";unlock($("gp").value.trim()).catch(()=>{$("gm").textContent="パスワードが違います"})}}
(()=>{let s="";try{s=localStorage.getItem(PWK)||""}catch(e){}if(s)unlock(s).catch(gate);else gate()})();
</script>
</body></html>
